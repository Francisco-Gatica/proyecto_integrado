{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clínica Dr. Juan Ignacio Hebel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #baf3d7 0%, #8cb5f3 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .navbar-pizarra {
            background-color: #5b738b;
        }
        .btn-pizarra {
            background-color: #5b738b;
            color: #ffffff;
            border: none;
            transition: background-color 0.2s;
        }
        .btn-pizarra:hover {
            background-color: #485c70;
            color: #ffffff;
        }
        .btn-outline-pizarra {
            color: #5b738b;
            border: 1.5px solid #5b738b;
            background-color: #ffffff;
            transition: all 0.2s;
        }
        .btn-outline-pizarra:hover {
            background-color: #5b738b;
            color: #ffffff;
        }
        .borde-pizarra {
            border-top: 5px solid #5b738b !important;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pizarra shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">Clínica Dr. Juan Ignacio Hebel</a>
            <div class="d-flex align-items-center gap-3">
                    <button type="submit" class="btn btn-light btn-sm rounded-pill px-3">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="navbar-pizarra text-white text-center py-3 mt-auto shadow-sm">
        <div class="container">
            <small>Desarrollado por: <strong>Francisco Neguiman, Bruno Muñon y Francisco Gatica</strong> &copy; 2026 - Clínica Dr. Juan Ignacio Hebel</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
